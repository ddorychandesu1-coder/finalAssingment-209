{% extends "base.html" %}

{% block content %}
<div class="text-center py-5">
  <h1 class="display-5 fw-bold">Organize your work, one task at a time</h1>
  <p class="lead text-muted">Create projects, set priorities and never miss a deadline.</p>
  {% if user.is_authenticated %}
    <p>You're logged in as <strong>{{ user.username }}</strong>.</p>
  {% else %}
    <a href="{% url 'register' %}" class="btn btn-primary btn-lg me-2">Get started</a>
    <a href="{% url 'login' %}" class="btn btn-outline-primary btn-lg">Login</a>
  {% endif %}
</div>
{% endblock %}
